<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>榴莲 QA 质检</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --y1:#D4DC5A;--y2:#c8d048;
  --g1:#5B9B2C;--g2:#4a8022;--g3:#dff0c8;
  --b1:#7A5C1E;--b2:#5c4315;--b3:#f5ead6;
  --tx:#1a1a18;--mu:#7a7a6e;
  --bd:rgba(0,0,0,0.09);--bs:#f6f6f0;--bk:#ffffff;
  --br:10px;--brl:14px;--sh:0 1px 4px rgba(0,0,0,0.07);
}
html,body{height:100%;overflow:hidden;background:var(--bs);}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;color:var(--tx);}
.app{max-width:430px;margin:0 auto;height:100vh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:88px;}
.screen{display:none;}.screen.active{display:block;}
.tb{background:var(--bk);border-bottom:0.5px solid var(--bd);padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;}
.tb-mark{width:32px;height:32px;border-radius:9px;background:var(--g1);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tb-mark-txt{font-size:13px;font-weight:900;color:white;letter-spacing:-.5px;font-style:italic;}
.tb-ttl{font-size:16px;font-weight:700;color:var(--tx);flex:1;letter-spacing:-.2px;}
.tb-usr{font-size:12px;color:var(--mu);background:var(--bs);border-radius:20px;padding:4px 12px;font-weight:500;}
.lw{padding:0 0 40px;}
.login-hero{background:linear-gradient(150deg,#2d4a12 0%,var(--g2) 45%,var(--g1) 75%,var(--y2) 100%);padding:52px 28px 44px;position:relative;overflow:hidden;}
.login-hero::before{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(212,220,90,0.12);}
.lh-logo{width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;margin-bottom:22px;position:relative;z-index:1;}
.lh-logo-txt{font-size:24px;font-weight:900;color:white;letter-spacing:-1px;font-style:italic;}
.lt{font-size:28px;font-weight:800;color:white;margin-bottom:6px;letter-spacing:-.5px;position:relative;z-index:1;}
.ls{font-size:14px;color:rgba(255,255,255,0.65);position:relative;z-index:1;}
.login-form{padding:28px 28px 0;}
.fl{font-size:12px;color:var(--mu);margin-bottom:5px;display:block;font-weight:600;letter-spacing:.03em;}
.fg{margin-bottom:16px;}
input,select,textarea{width:100%;padding:12px 14px;border-radius:var(--br);border:1.5px solid var(--bd);background:var(--bk);font-size:15px;color:var(--tx);font-family:inherit;-webkit-appearance:none;outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--g1);}
textarea{resize:none;line-height:1.6;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.bp{width:100%;padding:14px;border-radius:var(--br);background:var(--g1);color:white;font-size:15px;font-weight:700;border:none;cursor:pointer;margin-top:4px;}
.bp:active{opacity:.84;}
.bg2{padding:11px 16px;border-radius:var(--br);background:transparent;color:var(--mu);font-size:14px;border:1.5px solid var(--bd);cursor:pointer;font-weight:500;}
.hh{padding:22px 16px 14px;}
.hg{font-size:13px;color:var(--mu);margin-bottom:4px;font-weight:500;}
.hn{font-size:24px;font-weight:800;color:var(--tx);letter-spacing:-.4px;}
.hd{font-size:12px;color:var(--mu);margin-top:3px;}
.sl{font-size:10px;font-weight:700;color:var(--mu);letter-spacing:.09em;text-transform:uppercase;padding:0 16px;margin:20px 0 10px;}
.nbc{margin:0 16px;background:var(--g1);border-radius:var(--brl);padding:20px 18px;cursor:pointer;position:relative;overflow:hidden;}
.nbc:active{opacity:.88;}
.nbc::before{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(212,220,90,0.15);}
.nbc-t{font-size:17px;font-weight:700;color:white;margin-bottom:4px;position:relative;z-index:1;}
.nbc-s{font-size:13px;color:rgba(255,255,255,0.72);position:relative;z-index:1;}
.nbc-i{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:40px;height:40px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;color:white;z-index:1;}
.bl{padding:0 16px;}
.bi{background:var(--bk);border-radius:var(--brl);padding:14px 15px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);}
.bi:active{background:var(--bs);}
.bdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--b1);}
.bdot.done{background:var(--g1);}
.bdot.t3{background:var(--y2);}
.bdot.draft{background:var(--mu);}
.binfo{flex:1;min-width:0;}
.bid{font-size:14px;font-weight:700;color:var(--tx);}
.bmt{font-size:12px;color:var(--mu);margin-top:2px;}
.bst{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--b3);color:var(--b1);font-weight:700;white-space:nowrap;}
.bst.done{background:var(--g3);color:var(--g2);}
.bst.t3{background:rgba(212,220,90,0.2);color:var(--g2);}
.bst.draft{background:var(--bs);color:var(--mu);}
.bi-actions{display:flex;gap:6px;align-items:center;}
.bi-edit{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid var(--g1);color:var(--g1);background:transparent;cursor:pointer;}
.stat-grid{padding:0 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:12px;}
.stat-c{background:var(--bk);border-radius:var(--br);padding:13px 10px;text-align:center;box-shadow:var(--sh);}
.stat-n{font-size:24px;font-weight:800;color:var(--tx);}
.stat-l{font-size:10px;color:var(--mu);margin-top:2px;font-weight:500;}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bk);border-top:0.5px solid var(--bd);display:flex;padding:8px 0 calc(10px + env(safe-area-inset-bottom));}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;cursor:pointer;border:none;background:transparent;}
.nb svg{width:22px;height:22px;fill:var(--mu);}
.nb.on svg{fill:var(--g1);}
.nb span{font-size:10px;color:var(--mu);font-weight:500;}
.nb.on span{color:var(--g1);}
.ph{background:var(--bk);border-bottom:0.5px solid var(--bd);padding:13px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:56px;z-index:90;}
.back{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--bd);background:var(--bs);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.back svg{width:16px;height:16px;fill:var(--tx);}
.ph-ttl{font-size:16px;font-weight:700;color:var(--tx);}
.ph-sub{font-size:12px;color:var(--mu);}
.stb{padding:0 16px;margin:12px 0 0;}
.stt{display:flex;gap:4px;}
.ssb{flex:1;text-align:center;padding:7px 2px 8px;border-radius:var(--br);font-size:9px;font-weight:700;color:var(--mu);cursor:pointer;border:1.5px solid var(--bd);background:var(--bk);line-height:1.3;}
.ssb .sm{font-size:11px;display:block;}
.ssb .sh{font-size:9px;color:var(--mu);opacity:.8;display:block;margin-top:2px;}
.ssb.on{background:var(--g1);border-color:var(--g1);}
.ssb.on .sm,.ssb.on .sh{color:white;opacity:1;}
.ssb.dn{border-color:var(--y2);background:rgba(212,220,90,0.15);}
.ssb.dn .sm{color:var(--g2);}
.ssb.dn .sh{color:var(--g1);opacity:.9;}
.fc{margin:10px 16px;background:var(--bk);border-radius:var(--brl);padding:16px;box-shadow:var(--sh);}
.fct{font-size:11px;font-weight:700;color:var(--mu);margin-bottom:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;text-transform:uppercase;letter-spacing:.06em;}
.tag{background:var(--g3);color:var(--g2);font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;text-transform:none;letter-spacing:0;}
.warn{background:var(--b3);color:var(--b1);font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;text-transform:none;letter-spacing:0;}
.info-bar{background:rgba(212,220,90,0.15);border-radius:var(--br);padding:10px 13px;margin-bottom:12px;font-size:13px;color:var(--g2);font-weight:500;border-left:3px solid var(--y2);}
.pg{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;}
.pill{padding:8px 13px;border-radius:20px;font-size:13px;border:1.5px solid var(--bd);color:var(--mu);cursor:pointer;background:var(--bk);font-weight:500;}
.pill.on{background:rgba(212,220,90,0.2);color:var(--g2);border-color:var(--y2);font-weight:600;}
/* 照片确认勾选 */
.photo-confirm{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--br);border:1.5px dashed var(--bd);background:var(--bs);cursor:pointer;margin-top:10px;}
.photo-confirm.done{border-color:var(--g1);background:var(--g3);}
.photo-confirm-box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.photo-confirm.done .photo-confirm-box{background:var(--g1);border-color:var(--g1);}
.photo-confirm-txt{font-size:13px;color:var(--mu);font-weight:500;}
.photo-confirm.done .photo-confirm-txt{color:var(--g2);}
/* 计数器 */
.dr{display:flex;align-items:center;padding:10px 0;border-bottom:0.5px solid var(--bd);}
.dr:last-child{border-bottom:none;}
.dn2{flex:1;font-size:14px;color:var(--tx);font-weight:500;}
.dc{display:flex;align-items:center;gap:11px;}
.cb{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--bd);background:var(--bk);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx);line-height:1;}
.cb:active{background:var(--bs);}
.cv{font-size:17px;font-weight:700;min-width:26px;text-align:center;color:var(--tx);}
/* 问题率 */
.ac{background:rgba(212,220,90,0.18);border-radius:var(--br);padding:12px 14px;margin-top:13px;display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(212,220,90,0.4);}
.acl{font-size:12px;color:var(--g2);font-weight:600;}
.acd{font-size:11px;color:var(--g1);margin-top:2px;}
.acv{font-size:22px;font-weight:800;color:var(--g2);}
/* status bar */
.sb2{margin:10px 16px;border-radius:var(--br);padding:12px 14px;display:flex;align-items:center;gap:10px;}
.sb2.au{background:var(--b3);}
.sb2.gr{background:var(--g3);}
.sb2dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sb2.au .sb2dot{background:var(--b1);}
.sb2.gr .sb2dot{background:var(--g1);}
.sb2t{font-size:13px;font-weight:700;}
.sb2.au .sb2t{color:var(--b2);}
.sb2.gr .sb2t{color:var(--g2);}
.sb2s{font-size:11px;opacity:.8;font-weight:500;}
.ba{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--bk);border-top:0.5px solid var(--bd);padding:12px 16px calc(18px + env(safe-area-inset-bottom));display:flex;gap:10px;}
.ba .bp{margin:0;}
/* checklist */
.ck{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:0.5px solid var(--bd);}
.ck:last-child{border-bottom:none;}
.ck-box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--bd);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.ck-box.on{background:var(--g1);border-color:var(--g1);}
.ck-box.on svg{display:block;}
.ck-box svg{width:14px;height:14px;fill:white;display:none;}
.ck-txt{font-size:14px;color:var(--tx);line-height:1.55;font-weight:500;}
/* color grid */
.cng{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;}
.cni{background:var(--bs);border-radius:var(--br);padding:9px 4px;text-align:center;}
.cnl{font-size:11px;color:var(--mu);margin-bottom:7px;font-weight:600;}
.cnc{display:flex;align-items:center;justify-content:center;gap:3px;}
.cnb{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--bd);background:var(--bk);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx);}
.cnv{font-size:14px;font-weight:700;min-width:18px;text-align:center;color:var(--tx);}
/* box cards */
.box-card{background:var(--bk);border-radius:var(--brl);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh);}
.box-head{padding:13px 15px;display:flex;align-items:center;gap:11px;cursor:pointer;}
.box-head:active{background:var(--bs);}
.box-num{width:30px;height:30px;border-radius:50%;background:var(--g3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--g2);flex-shrink:0;}
.box-info2{flex:1;}
.box-title2{font-size:14px;font-weight:700;color:var(--tx);}
.box-sub2{font-size:11px;color:var(--mu);margin-top:2px;font-weight:500;}
.box-tog{font-size:15px;color:var(--mu);}
.box-body{padding:13px 15px 15px;display:none;border-top:0.5px solid var(--bd);}
.box-body.open{display:block;}
.add-box{display:flex;align-items:center;justify-content:center;gap:9px;padding:15px;border-radius:var(--brl);border:2px dashed var(--y2);background:rgba(212,220,90,0.1);cursor:pointer;margin:0 16px 10px;font-size:14px;font-weight:700;color:var(--g2);}
.add-box:active{opacity:.8;}
/* summary */
.sum-card{margin:0 16px 10px;background:linear-gradient(140deg,#2d4a12,var(--g2),var(--g1));border-radius:var(--brl);padding:16px;}
.sum-title{font-size:10px;font-weight:700;color:rgba(255,255,255,0.65);margin-bottom:12px;text-transform:uppercase;letter-spacing:.08em;}
.sum-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.sum-item{text-align:center;}
.sum-n{font-size:24px;font-weight:800;color:white;}
.sum-l{font-size:10px;color:rgba(255,255,255,0.65);margin-top:2px;font-weight:500;}
/* add row */
.add-row{display:flex;gap:8px;margin-top:9px;}
.add-row input{flex:1;}
.cfm{padding:11px 14px;border-radius:var(--br);background:var(--g1);color:white;font-size:13px;font-weight:700;border:none;cursor:pointer;white-space:nowrap;}
.saw{display:flex;gap:8px;align-items:center;}
.saw select{flex:1;}
.at{padding:11px 14px;border-radius:var(--br);border:1.5px solid var(--g1);background:transparent;color:var(--g1);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:var(--bk);border-radius:20px 20px 0 0;padding:24px 20px calc(28px + env(safe-area-inset-bottom));width:100%;max-width:430px;}
.modal-title{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:6px;}
.modal-sub{font-size:13px;color:var(--mu);margin-bottom:20px;}
.modal-btn{width:100%;padding:14px;border-radius:var(--br);font-size:15px;font-weight:700;border:none;cursor:pointer;margin-bottom:10px;}
.modal-btn.primary{background:var(--g1);color:white;}
.modal-btn.secondary{background:var(--bs);color:var(--tx);}
.modal-btn:last-child{margin-bottom:0;}

/* toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--g2);color:white;padding:10px 24px;border-radius:30px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,0.18);}
.toast.show{opacity:1;}
/* submit card */
.submit-card{margin:10px 16px;background:var(--g3);border-radius:var(--brl);padding:18px;}
.submit-card .sct{font-size:14px;font-weight:700;color:var(--g2);margin-bottom:5px;}
.submit-card p{font-size:13px;color:var(--g1);margin-bottom:14px;font-weight:500;}
</style>
</head>
<body>
<div class="app" id="app">
<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div class="screen active" id="s-login">
  <div class="lw">
    <div class="login-hero">
      <div class="lh-logo"><span class="lh-logo-txt">QA</span></div>
      <div class="lt">榴莲 QA 质检</div>
      <div class="ls">誉泽农供应链 · 内部系统</div>
    </div>
    <div class="login-form">
      <div class="fg"><label class="fl">所在城市</label>
        <select id="login-region" onchange="onRegionChange()">
          <option value="">请选择城市</option>
          <option>嘉兴</option><option>郑州</option><option>广州</option>
          <option>高碑店</option><option>长沙</option><option>青岛</option>
          <option>无锡</option><option>管理</option>
        </select>
      </div>
      <div class="fg"><label class="fl">选择账号</label>
        <div class="saw"><select id="ln"></select><button class="at" onclick="toggleAddUser()">+ 新增</button></div>
        <div class="add-row" id="add-user-row" style="display:none;"><input type="text" id="new-user-input" placeholder="输入姓名"/><button class="cfm" onclick="confirmUser()">确认</button></div>
      </div>
      <button class="bp" onclick="doLogin()">进入系统</button>
    </div>
  </div>
</div>

<!-- TOPBAR -->
<div class="tb" id="tb" style="display:none;">
  <div class="tb-mark"><span class="tb-mark-txt">QA</span></div>
  <div class="tb-ttl">榴莲 QA 质检</div>
  <div class="tb-usr" id="tb-usr">张文庆</div>
</div>

<!-- HOME -->
<div class="screen" id="s-home">
  <div class="hh">
    <div class="hg">你好，</div>
    <div class="hn" id="home-n">张文庆</div>
    <div class="hd" id="home-d">加载中...</div>
  </div>
  <div style="padding:0 16px 4px;">
    <div class="nbc" onclick="goTo('s-binfo');editMode=false;clearBatchForm();">
      <div class="nbc-t">新建验货批次</div>
      <div class="nbc-s">开始 T0–T5 完整质检流程</div>
      <div class="nbc-i">+</div>
    </div>
  </div>
  <div class="sl">近期批次</div>
  <div class="bl" id="batch-list"></div>
  <div class="sl">本周概览</div>
  <div class="stat-grid">
    <div class="stat-c"><div class="stat-n" id="stat-batches">—</div><div class="stat-l">批次</div></div>
    <div class="stat-c"><div class="stat-n" id="stat-rate" style="color:var(--b1);">—</div><div class="stat-l">平均问题率</div></div>
    <div class="stat-c"><div class="stat-n" id="stat-complaints" style="color:var(--g1);">—</div><div class="stat-l">客诉</div></div>
  </div>
  <div class="bnav">
    <button class="nb on"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>首页</span></button>
    <button class="nb"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg><span>批次</span></button>
    <button class="nb"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg><span>数据</span></button>
    <button class="nb"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>我的</span></button>
  </div>

<script>

var QA_REGIONS = {

var S={user:'',team:'',currentBatchId:null,currentStep:0,batchSpecs:[],boxCount:0};
var editMode=false;
var ORIGINS={
  '泰国':[{l:'北部 · 程逸',v:'北部·程逸'},{l:'东北部 · 四色菊',v:'东北部·四色菊'},{l:'东部 · 尖竹汶',v:'东部·尖竹汶'},{l:'南部 · 春蓬',v:'南部·春蓬'}],
  '越南':[{l:'中部 · 邦美蜀',v:'中部·邦美蜀'},{l:'南部 · 前江',v:'南部·前江'}],
  '马来西亚':[{l:'彭亨州',v:'彭亨州'},{l:'柔佛州',v:'柔佛州'}],
  '柬埔寨':[],
  '老挝':[{l:'巴色',v:'巴色'},{l:'阿速坡',v:'阿速坡'}],
  '其他':[]
};

function lsGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function p2(n){return n<10?'0'+n:n;}


// ── 测试批次预置 ─────────────────────────────────────

function init(){
  var now=new Date();
  var ds=now.getFullYear()+'-'+p2(now.getMonth()+1)+'-'+p2(now.getDate());
  var de=document.getElementById('bi-date');if(de)de.value=ds;
  // 账号由地区联动，不需要预渲染
  renderBrandSelect(lsGet('qa:brands')||['兴盛','浩田']);
  injectTestBatch();
}
function renderUserSelect(u){var s=document.getElementById('ln');if(!s)return;s.innerHTML='';u.forEach(function(x){var o=document.createElement('option');o.value=x;o.textContent=x==='sasa'?'sasa（test）':x+'（质检员）';s.appendChild(o);});}
function renderBrandSelect(b){var s=document.getElementById('brand-sel');if(!s)return;s.innerHTML='';b.forEach(function(x){var o=document.createElement('option');o.value=x;o.textContent=x;s.appendChild(o);});}
function toggleAddUser(){var r=document.getElementById('add-user-row');r.style.display=r.style.display==='none'?'flex':'none';if(r.style.display==='flex')document.getElementById('new-user-input').focus();}
function confirmUser(){var v=document.getElementById('new-user-input').value.trim();if(!v)return;var u=lsGet('qa:users')||['张文庆','sasa'];if(!u.includes(v)){u.push(v);lsSet('qa:users',u);}renderUserSelect(u);document.getElementById('ln').value=v;document.getElementById('add-user-row').style.display='none';document.getElementById('new-user-input').value='';}
function toggleAddBrand(){var r=document.getElementById('add-brand-row');r.style.display=r.style.display==='none'?'flex':'none';if(r.style.display==='flex')document.getElementById('new-brand-input').focus();}
function confirmBrand(){var v=document.getElementById('new-brand-input').value.trim();if(!v)return;var b=lsGet('qa:brands')||['兴盛','浩田'];if(!b.includes(v)){b.push(v);lsSet('qa:brands',b);}renderBrandSelect(b);document.getElementById('brand-sel').value=v;document.getElementById('add-brand-row').style.display='none';document.getElementById('new-brand-input').value='';}
function onOriginChange(){
  var origin=document.getElementById('bi-origin').value;
  var wrap=document.getElementById('region-wrap');
  var sel=document.getElementById('bi-region');
  if(!origin){wrap.style.display='none';return;}
  var saved=lsGet('qa:regions:'+origin)||[];
  var preset=ORIGINS[origin]||[];
  var all=preset.map(function(o){return{label:o.l,value:o.v};}).concat(saved.map(function(s){return{label:s,value:s};}));
  sel.innerHTML='<option value="">请选择产区</option>'+all.map(function(o){return'<option value="'+o.value+'">'+o.label+'</option>';}).join('');
  wrap.style.display='block';
  document.getElementById('add-region-row').style.display='none';
}
function toggleAddRegion(){var r=document.getElementById('add-region-row');r.style.display=r.style.display==='none'?'flex':'none';if(r.style.display==='flex')document.getElementById('new-region-input').focus();}
function confirmRegion(){var v=document.getElementById('new-region-input').value.trim();if(!v)return;var origin=document.getElementById('bi-origin').value;if(!origin){showToast('请先选择产地',true);return;}var saved=lsGet('qa:regions:'+origin)||[];if(!saved.includes(v)){saved.push(v);lsSet('qa:regions:'+origin,saved);}var sel=document.getElementById('bi-region');var opt=document.createElement('option');opt.value=v;opt.textContent=v;opt.selected=true;sel.appendChild(opt);document.getElementById('add-region-row').style.display='none';document.getElementById('new-region-input').value='';showToast('产区已保存 ✓');}

function doLogin(){
  var region=document.getElementById('login-region').value;
  var user=document.getElementById('ln').value;
  if(!region||!user||user==='请先选择城市'||user==='待分配人员'){showToast('请选择城市和账号',true);return;}
  S.user=user;S.team=region+' · QA组';
  document.getElementById('tb-usr').textContent=S.user;
  document.getElementById('home-n').textContent=S.user;
  var qp=document.getElementById('qa-person');if(qp)qp.value=S.user;
  goTo('s-home');loadHome();
}

function loadHome(){
  var now=new Date();
  document.getElementById('home-d').textContent=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 · '+S.team;
  var ids=lsGet('qa:batch-list')||[];
  var bl=document.getElementById('batch-list');
  if(!ids.length){bl.innerHTML='<div style="padding:28px;text-align:center;color:var(--mu);font-size:13px;">还没有批次记录</div>';document.getElementById('stat-batches').textContent='0';document.getElementById('stat-rate').textContent='—';document.getElementById('stat-complaints').textContent='0';return;}
  var recent=ids.slice(-10).reverse();var html='';var wb=0,wc=0,rates=[];var wa=Date.now()-7*24*3600*1000;
  recent.forEach(function(id){
    var b=lsGet('qa:batch:'+id);if(!b)return;
    var iw=b.createdAt>wa;if(iw){wb++;if(b.complaints)wc+=b.complaints;if(b.problemRate)rates.push(b.problemRate);}
    var sc=b.status==='submitted'?'done':b.status==='t3_submitted'?'t3':b.status==='draft'?'draft':'';
    var st=b.status==='submitted'?'已结算':b.status==='t3_submitted'?'开柜已提交':b.status==='draft'?'草稿':'进行中 '+SL(b.currentStep||0);
    html+='<div class="bi"><div class="bdot '+sc+'"></div><div class="binfo" onclick="openBatch(\''+id+'\')"><div class="bid">'+b.id+' · '+b.brand+' '+b.variety+'</div><div class="bmt">'+b.specs+' · '+b.boxes+'箱 · '+b.transport+b.days+'天</div></div>'+
    '<div class="bi-actions"><button class="bi-edit" onclick="editBatch(\''+id+'\')">编辑</button><div class="bst '+sc+'">'+st+'</div></div></div>';
  });
  bl.innerHTML=html||'<div style="padding:28px;text-align:center;color:var(--mu);font-size:13px;">还没有批次记录</div>';
  document.getElementById('stat-batches').textContent=wb;
  document.getElementById('stat-rate').textContent=rates.length?(rates.reduce(function(a,b){return a+b;},0)/rates.length).toFixed(1)+'%':'—';
  document.getElementById('stat-complaints').textContent=wc;
}
function SL(n){return['到货','T0','T1','T2','T3','T4','T5'][n]||'T0';}

function clearBatchForm(){
  var now=new Date();
  var ds=now.getFullYear()+'-'+p2(now.getMonth()+1)+'-'+p2(now.getDate());
  ['bi-cabinet','bi-original','bi-plate','bi-days','bi-boxes','bi-specs'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('bi-date').value=ds;
  document.getElementById('bi-origin').value='';
  document.getElementById('region-wrap').style.display='none';
  document.getElementById('qa-person').value=S.user;
  document.getElementById('binfo-title').textContent='到货信息';
  document.getElementById('binfo-sub').textContent='新建批次 · * 为必填';
  document.getElementById('binfo-save-btn').textContent='保存并开始 T0 →';
}

function editBatch(id){
  var b=lsGet('qa:batch:'+id);if(!b)return;
  editMode=true;S.currentBatchId=id;
  document.getElementById('binfo-title').textContent='编辑批次信息';
  document.getElementById('binfo-sub').textContent='修改后保存返回';
  document.getElementById('binfo-save-btn').textContent='保存修改';
  document.getElementById('bi-cabinet').value=b.cabinetNo||b.id||'';
  document.getElementById('bi-cabinet').readOnly=true; // 柜号不能改
  document.getElementById('bi-original').value=b.originalNo||'';
  document.getElementById('bi-plate').value=b.plate||'';
  document.getElementById('bi-date').value=b.date||'';
  renderBrandSelect(lsGet('qa:brands')||['兴盛','浩田']);
  injectTestBatch();
  document.getElementById('brand-sel').value=b.brand||'';
  document.getElementById('bi-variety').value=b.variety||'干尧';
  document.getElementById('bi-origin').value=b.origin||'';
  if(b.origin)onOriginChange();
  setTimeout(function(){document.getElementById('bi-region').value=b.region||'';},50);
  document.getElementById('bi-transport').value=b.transport||'陆运';
  document.getElementById('bi-days').value=b.days||'';
  document.getElementById('bi-boxes').value=b.boxes||'';
  document.getElementById('bi-specs').value=b.specs||'';
  document.getElementById('qa-person').value=b.inspector||S.user;
  goTo('s-binfo');
}

function saveBatchInfo(){
  var cab=document.getElementById('bi-cabinet').value.trim();
  var orig=document.getElementById('bi-original').value.trim();
  var plate=document.getElementById('bi-plate').value.trim();
  var date=document.getElementById('bi-date').value.trim();
  if(!cab||!orig||!plate||!date){showToast('柜号、原柜号、车牌挂号、到货日期均为必填',true);return;}
  var specs=document.getElementById('bi-specs').value.trim();
  S.batchSpecs=specs?specs.split(/[\s,，]+/).filter(Boolean):[];
  if(editMode){
    var b=lsGet('qa:batch:'+S.currentBatchId);
    if(!b)return;
    b.originalNo=orig;b.plate=plate;b.date=date;
    b.brand=document.getElementById('brand-sel').value;
    b.variety=document.getElementById('bi-variety').value;
    b.origin=document.getElementById('bi-origin').value;
    b.region=document.getElementById('bi-region').value;
    b.transport=document.getElementById('bi-transport').value;
    b.days=document.getElementById('bi-days').value;
    b.boxes=document.getElementById('bi-boxes').value;
    b.specs=specs;b.specList=S.batchSpecs;b.updatedAt=Date.now();
    lsSet('qa:batch:'+S.currentBatchId,b);
    document.getElementById('bi-cabinet').readOnly=false;
    showSaveModal(S.currentBatchId, '批次信息已更新', '接下来你想做什么？');
  }else{
    var b={id:cab,cabinetNo:cab,originalNo:orig,plate:plate,date:date,
      brand:document.getElementById('brand-sel').value,
      variety:document.getElementById('bi-variety').value,
      origin:document.getElementById('bi-origin').value,
      region:document.getElementById('bi-region').value,
      transport:document.getElementById('bi-transport').value,
      days:document.getElementById('bi-days').value,
      boxes:document.getElementById('bi-boxes').value,
      specs:specs,specList:S.batchSpecs,inspector:S.user,
      status:'draft',currentStep:1,createdAt:Date.now(),updatedAt:Date.now(),
      steps:{},boxCount:0,complaints:0,problemRate:null};
    lsSet('qa:batch:'+cab,b);
    var ids=lsGet('qa:batch-list')||[];if(!ids.includes(cab)){ids.push(cab);lsSet('qa:batch-list',ids);}
    S.currentBatchId=cab;S.boxCount=0;
    showSaveModal(cab, '批次已创建', '接下来你想做什么？');
  }
}


function showSaveModal(batchId, title, sub){
  document.getElementById('save-modal-title').textContent = title;
  document.getElementById('save-modal-sub').textContent = sub;
  var btn = document.getElementById('save-modal-next');
  btn.onclick = function(){ closeSaveModal(); openBatch(batchId); };
  document.getElementById('save-modal').style.display = 'flex';

function showStep(i){
  S.currentStep=i;
  document.querySelectorAll('#step-track .ssb').forEach(function(b,j){b.classList.remove('on','dn');if(j<i)b.classList.add('dn');else if(j===i)b.classList.add('on');});
  var sd=SD[i];var saved=null;
  if(S.currentBatchId){var b=lsGet('qa:batch:'+S.currentBatchId);if(b&&b.steps)saved=b.steps['t'+i]||null;}
  document.getElementById('step-body').innerHTML='<div class="sb2 '+sd.c+'"><div class="sb2dot"></div><div><div class="sb2t">'+sd.t+'</div><div class="sb2s" style="color:'+(sd.c==='gr'?'var(--g1)':'var(--b1)')+';">'+sd.s+'</div></div></div>'+BC(i);
  var nb=document.getElementById('step-next-btn');
  if(nb)nb.textContent=i<6?'保存继续 '+SD[i+1].l+' →':'提交完整报告';
  if(saved)restoreStep(saved);
  if(i===3){
    // 恢复已有箱或新建第一箱
    var boxList=document.getElementById('box-list');
    if(boxList){
      boxList.innerHTML='';
      if(S.boxCount===0){
        addBox();
      }else{
        for(var n=1;n<=S.boxCount;n++){
          boxList.insertAdjacentHTML('beforeend',renderBox(n));
          // 除最后一箱，其他折叠
          if(n<S.boxCount){
            var bb=document.getElementById('bbody-'+n);
            var bt=document.getElementById('btog-'+n);
            if(bb)bb.classList.remove('open');
            if(bt)bt.textContent='▶';
          }
        }
        // 恢复每箱数据
        if(saved && saved._boxes){
          restoreBoxData(saved._boxes);
        }
        document.getElementById('box-cnt').textContent=S.boxCount;
        updateNextBoxNum();
      }
    }
  }
  document.getElementById('app').scrollTo(0,0);
}

function collectStep(){
  var data={savedAt:Date.now()};
  document.getElementById('step-body').querySelectorAll('input[id],select[id],textarea[id]').forEach(function(el){data[el.id]=el.value;});
  var ctr={};document.getElementById('step-body').querySelectorAll('.cv[id]').forEach(function(el){ctr[el.id]=el.textContent;});data._c=ctr;
  var col={};for(var i=1;i<=5;i++){var e=document.getElementById('cnv-'+i);if(e)col[i]=e.textContent;}data._col=col;
  data._bc=S.boxCount;
  // 收集每箱数据
  var boxes={};
  for(var bn=1;bn<=S.boxCount;bn++){
    var boxData={};
    document.getElementById('step-body').querySelectorAll('[id^="bspec-'+bn+'"],[id^="bpos-'+bn+'"],[id^="bwt-'+bn+'"],[id^="bewt-'+bn+'"],[id^="bnote-'+bn+'"]').forEach(function(el){boxData[el.id]=el.value;});
    // 计数器
    ['lanci','bug','mech','skin','crack','oth1','dead','raw','white','burn','miss','oth2'].forEach(function(k){
      var e=document.getElementById('b'+bn+'-'+k);if(e)boxData['b'+bn+'-'+k]=e.textContent;
    });
    boxes[bn]=boxData;
  }
  data._boxes=boxes;
  return data;
}
function restoreStep(data){
  if(!data)return;
  Object.keys(data).forEach(function(k){if(k.startsWith('_')||k==='savedAt')return;var el=document.getElementById(k);if(el&&(el.tagName==='INPUT'||el.tagName==='SELECT'||el.tagName==='TEXTAREA'))el.value=data[k];});
  if(data._c)Object.keys(data._c).forEach(function(k){var e=document.getElementById(k);if(e)e.textContent=data._c[k];});
  if(data._col)Object.keys(data._col).forEach(function(c){var e=document.getElementById('cnv-'+c);if(e)e.textContent=data._col[c];});
  showToast('已恢复上次记录 ✓');
}
function autoSave(){
  if(!S.currentBatchId)return;
  var data=collectStep();
  var b=lsGet('qa:batch:'+S.currentBatchId);if(!b)return;
  if(!b.steps)b.steps={};b.steps['t'+S.currentStep]=data;
  b.currentStep=S.currentStep;b.boxCount=S.boxCount;b.updatedAt=Date.now();
  lsSet('qa:batch:'+S.currentBatchId,b);
}

function saveAndNext(){

  }
}

async function submitToFeishu(batchId,isFinal){
  var b=lsGet('qa:batch:'+batchId);if(!b){showToast('找不到批次数据',true);return;}

      }else{
        var all=Object.assign({},buildT3Fields(b),upd);all['提交状态']='已结算完整质量报告';
        var r=await fetch(base,{method:'POST',headers:hdr,body:JSON.stringify({fields:all})});

      FG('环境温度(℃)','<input type="text" id="t0-env-temp" placeholder="如 28"/>',false)+
      FG('环境湿度(%)','<input type="text" id="t0-env-humi" placeholder="如 75"/>',false)+
      '</div>')
  );

  if(i===2)return (
    FC('开柜门观察',
      '<div class="info-bar">请检查整体整齐度，并记录发现的问题</div>'+
      FG('发现的问题（可多选）',
        '<div class="pg"><div class="pill" onclick="tp(this)">倾斜</div><div class="pill" onclick="tp(this)">破损</div><div class="pill" onclick="tp(this)">脏污潮湿</div><div class="pill" onclick="tp(this)">无异常</div></div>')+
      FG('问题说明','<textarea id="t1-issue-note" rows="2" placeholder="描述程度或详细情况..."></textarea>')+
      FG('气味评估（开柜15-20分钟后）',
        '<div class="pg"><div class="pill on" onclick="tp(this)">清香</div><div class="pill" onclick="tp(this)">浓香</div><div class="pill" onclick="tp(this)">异味</div><div class="pill" onclick="tp(this)">其他</div></div>'+
        '<input type="text" id="t1-smell-note" placeholder="补充说明气味..." style="margin-top:9px;"/>')+
      PHOTO('开柜整体（水印照片）')+PHOTO('开柜视频已拍摄'))+
    FC('抽检位置覆盖',
      FG('本次抽检总箱数','<input type="text" id="t1-sample-boxes" placeholder="箱"/>',false)+
      FG('位置覆盖说明','<textarea id="t1-pos-note" rows="3" placeholder="如：柜头上中下排各2箱，柜尾2箱，含所有规格..."></textarea>'))+
    FC('随车温度记录仪',
      '<div class="g3">'+
      FG('柜头果肉温度(℃)','<input type="text" id="t1-ft-head" placeholder="0.0"/>',false)+
      FG('柜中果肉温度(℃)','<input type="text" id="t1-ft-mid" placeholder="0.0"/>',false)+
      FG('柜尾果肉温度(℃)','<input type="text" id="t1-ft-tail" placeholder="0.0"/>',false)+
      '</div>'+
      FG('温度补充说明','<textarea id="t1-temp-note" rows="3" placeholder="如有更多抽测点或异常情况请在此记录..."></textarea>')+
      PHOTO('温度记录仪屏幕（水印照片）'))
  );

  if(i===3)return (
    '<div class="sum-card"><div class="sum-title">累计检验汇总</div>'+
    '<div class="sum-grid">'+
    '<div class="sum-item"><div class="sum-n" id="box-cnt">0</div><div class="sum-l">已检箱数</div></div>'+
    '<div class="sum-item"><div class="sum-n" id="s-total">0</div><div class="sum-l">问题总数</div></div>'+
    '<div class="sum-item"><div class="sum-n" id="s-rate">—</div><div class="sum-l">问题率</div></div>'+
    '</div></div>'+
    '<div id="box-list" style="padding:0 16px;"></div>'+
    '<div class="add-box" onclick="addBox()">+ 新增第 <span id="next-box-num">2</span> 箱检验记录</div>'+
    FC('果肉缺陷汇总 <span class="warn">所有箱累计</span>',
      DR('f-dead','死包')+DR('f-raw','夹生',3)+DR('f-white','白肉',1)+
      DR('f-burn','烧核')+DR('f-miss','缺房')+DR('f-oth2','其他果肉')+
      '<div class="g2" style="margin-top:12px;">'+
      FG('抽样总颗数（手动填写）','<input type="text" id="tc" placeholder="如 48" oninput="calcRate()"/>',false)+
      '<div></div></div>'+
      '<div class="ac"><div><div class="acl">果肉问题率（自动计算）</div><div class="acd" id="cd">请填写抽样颗数</div></div><div class="acv" id="cr">—%</div></div>')+
    FC('大小果检验',
      '<div style="font-size:13px;color:var(--mu);margin-bottom:10px;">直接填写本次验到的大果和小果重量</div>'+
      (S.batchSpecs.length?S.batchSpecs.map(function(s){return'<div style="margin-bottom:12px;"><div style="font-size:13px;font-weight:700;color:var(--tx);margin-bottom:7px;">'+s+'</div>'+
      '<div class="g2">'+FG('大果重量(kg)','<input type="text" placeholder="0.0" id="sz-'+s+'-max"/>',false)+FG('小果重量(kg)','<input type="text" placeholder="0.0" id="sz-'+s+'-min"/>',false)+'</div></div>';}).join(''):'<div style="font-size:13px;color:var(--mu);">（到货信息中未填写规格，请直接在下方备注）</div>')+
      FG('缺重备注','<textarea id="t2-weight-note" rows="2" placeholder="如：柜尾C3缺重1.0kg..."></textarea>'))+
    FC('实收箱数确认 <span class="warn">T2完成后清点</span>',
      '<div class="g2">'+FG('实收箱数','<input type="text" id="t2-actual-boxes" placeholder="箱"/>',false)+FG('空箱数','<input type="text" id="t2-empty-boxes" placeholder="箱"/>',false)+'</div>'+
      FG('差异说明','<textarea id="t2-box-note" rows="2" placeholder="如有差异说明原因..."></textarea>'))
  );

  if(i===4)return (
    FC('开果试吃记录',
      '<div class="g2">'+FG('取样日期','<input type="text" id="t3-date" placeholder="如 2026-03-17"/>',false)+FG('取样位置','<select id="t3-pos"><option>柜头</option><option>柜中</option><option>柜尾</option></select>',false)+'</div>'+
      '<div class="g2">'+FG('糖度(%)','<input type="text" id="t3-sugar" placeholder="如 32.5"/>',false)+FG('位置补充','<input type="text" id="t3-pos-note" placeholder="如 上排右侧"/>',false)+'</div>'+
      FG('口感','<div class="pg"><div class="pill on" onclick="tp(this)">绵密</div><div class="pill" onclick="tp(this)">干香</div><div class="pill" onclick="tp(this)">偏苦</div><div class="pill" onclick="tp(this)">偏淡</div><div class="pill" onclick="tp(this)">夹生</div></div>')+
      FG('果肉质量问题','<div class="pg"><div class="pill on" onclick="tp(this)">正常</div><div class="pill" onclick="tp(this)">死包</div><div class="pill" onclick="tp(this)">夹生</div><div class="pill" onclick="tp(this)">过熟</div><div class="pill" onclick="tp(this)">白肉</div><div class="pill" onclick="tp(this)">烧核</div></div>')+
      PHOTO('果肉剖面照片已拍摄')+PHOTO('试吃视频已拍摄'))+
    FC('销售区抽检',
      '<div class="g2">'+FG('抽检日期','<input type="text" id="t3-check-date" placeholder="如 2026-03-17"/>',false)+FG('补充抽检数量','<input type="text" id="t3-check-count" placeholder="颗"/>',false)+'</div>'+
      FG('发现问题','<div class="pg"><div class="pill on" onclick="tp(this)">无新增问题</div><div class="pill" onclick="tp(this)">夹生</div><div class="pill" onclick="tp(this)">死包</div><div class="pill" onclick="tp(this)">过熟</div><div class="pill" onclick="tp(this)">白肉</div></div>')+
      FG('说明','<textarea id="t3-check-note" rows="2" placeholder="补充记录..."></textarea>')+
      PHOTO('问题果照片已拍摄'))+
    '<div class="submit-card"><div class="sct">开柜质检报告 · 可提交</div><p>完成 T0–T3，当天开柜报告即可生成并同步到飞书</p><button class="bp" style="background:var(--g1);margin-top:0;" onclick="submitT3Report();generatePDF(false);">生成并提交开柜报告</button></div>'
  );

  if(i===5)return FC('库存质量检查',
    '<div class="g2">'+FG('检查日期','<input type="text" id="t4-date" placeholder="如 2026-03-18"/>',false)+FG('库存位置','<input type="text" id="t4-location" placeholder="如 A区3排"/>',false)+'</div>'+
    FG('成熟度变化','<div class="pg"><div class="pill on" onclick="tp(this)">稳定正常</div><div class="pill" onclick="tp(this)">成熟度加速</div><div class="pill" onclick="tp(this)">过熟/需处理</div></div>')+
    FG('新发现质量瑕疵','<div class="pg"><div class="pill on" onclick="tp(this)">无新增</div><div class="pill" onclick="tp(this)">烂刺增多</div><div class="pill" onclick="tp(this)">裂口</div><div class="pill" onclick="tp(this)">发霉</div><div class="pill" onclick="tp(this)">其他</div></div>'+
    '<textarea id="t4-defect-note" rows="2" placeholder="描述新发现瑕疵情况..." style="margin-top:9px;"></textarea>')+
    FG('处理建议','<textarea id="t4-suggestion" rows="2" placeholder="如：建议加快该规格销售..."></textarea>')+
    PHOTO('库存检查照片已拍摄'));

  if(i===6)return (
    FC('客户投诉记录',
      '<div class="g2">'+FG('投诉日期','<input type="text" id="t5-complaint-date" placeholder="如 2026-03-18"/>',false)+FG('客户联系（选填）','<input type="text" id="t5-customer" placeholder="手机或微信"/>',false)+'</div>'+
      FG('投诉问题类型','<div class="pg"><div class="pill on" onclick="tp(this)">夹生</div><div class="pill" onclick="tp(this)">死包</div><div class="pill" onclick="tp(this)">白肉</div><div class="pill" onclick="tp(this)">烂刺</div><div class="pill" onclick="tp(this)">过熟</div><div class="pill" onclick="tp(this)">其他</div></div>')+
      '<div class="g2">'+FG('涉及箱号/批次','<input type="text" id="t5-box-no" placeholder="如 A3-023"/>',false)+FG('涉及数量','<input type="text" id="t5-complaint-qty" placeholder="颗"/>',false)+'</div>'+
      FG('问题描述','<textarea id="t5-complaint-desc" rows="2" placeholder="客户反映的具体情况..."></textarea>')+
      FG('是否与T2结论一致','<div class="pg"><div class="pill on" onclick="tp(this)">一致</div><div class="pill" onclick="tp(this)">不一致</div><div class="pill" onclick="tp(this)">无法判断</div></div>')+
      FG('处理结果','<div class="pg"><div class="pill" onclick="tp(this)">补货</div><div class="pill" onclick="tp(this)">退款</div><div class="pill on" onclick="tp(this)">处理中</div><div class="pill" onclick="tp(this)">不成立</div></div>')+
      PHOTO('客户提供的问题照片已确认'))+
    FC('损耗记录',
      '<div class="g2">'+FG('记录日期','<input type="text" id="t5-loss-date" placeholder="日期"/>',false)+FG('累计损耗数量','<input type="text" id="t5-loss-qty" placeholder="颗"/>',false)+'</div>'+
      FG('主要损耗原因','<div class="pg"><div class="pill on" onclick="tp(this)">成熟度过高</div><div class="pill" onclick="tp(this)">机械损伤</div><div class="pill" onclick="tp(this)">储存问题</div><div class="pill" onclick="tp(this)">客户退货</div><div class="pill" onclick="tp(this)">其他</div></div>')+
      FG('损耗说明','<textarea id="t5-loss-note" rows="2" placeholder="具体描述损耗情况..."></textarea>'))+
    '<div class="submit-card"><div class="sct">一柜完整质量报告</div><p>T0–T5 全流程记录完成，可生成完整追溯报告并同步到飞书</p><button class="bp" style="background:var(--g1);margin-top:0;" onclick="saveAndNext();generatePDF(true);">生成并导出完整报告</button></div>'
  );
  return '';
}

init();
</script>
</body>

<!-- PDF打印样式（隐藏，生成报告时注入新窗口） -->
<script>
// ── 图片选择存储 ────────────────────────────────────
var photoStore={};
function handlePhotoSelect(inputEl,key){
  var file=inputEl.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    photoStore[key]=e.target.result;
    var confirm=inputEl.closest('.photo-row');
    if(confirm){confirm.classList.add('has-photo');var txt=confirm.querySelector('.photo-txt');if(txt)txt.textContent='✓ 已选择照片';}
  };
  reader.readAsDataURL(file);
}

// ── PDF生成 ─────────────────────────────────────────
function generatePDF(isFinal){
  var b=lsGet('qa:batch:'+S.currentBatchId);
  if(!b){showToast('找不到批次数据',true);return;}
  var steps=b.steps||{};
  var s0=steps.t0||{},s1=steps.t1||{},s2=steps.t2||{},s3=steps.t3||{},s4=steps.t4||{},s5=steps.t5||{},s6=steps.t6||{};
  var ctr=s3._c||{};
  var now=new Date();
  var dateStr=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日';
  var reportType=isFinal?'完整质量报告':'开柜验货报告';

  var html='<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">'+
  '<title>'+b.id+' · '+reportType+'</title>'+
  '<style>'+
  '@page{margin:15mm 12mm;}'+
  '*{box-sizing:border-box;margin:0;padding:0;}'+
  'body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;color:#1a1a18;font-size:11pt;line-height:1.5;}'+
  // 页头
  '.header{background:linear-gradient(135deg,#2d4a12,#4a8022,#5B9B2C);color:white;padding:18px 20px;border-radius:8px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-start;}'+
  '.header-left .logo{font-size:18pt;font-weight:900;font-style:italic;letter-spacing:-1px;margin-bottom:4px;}'+
  '.header-left .company{font-size:9pt;opacity:.8;}'+
  '.header-right{text-align:right;}'+
  '.header-right .report-type{font-size:13pt;font-weight:700;margin-bottom:4px;}'+
  '.header-right .report-date{font-size:9pt;opacity:.8;}'+
  // 批次摘要
  '.batch-bar{background:#f0f7e6;border:1px solid #c8d048;border-radius:6px;padding:10px 14px;margin-bottom:12px;display:flex;gap:24px;flex-wrap:wrap;}'+
  '.batch-item{display:flex;flex-direction:column;}'+
  '.batch-item .lbl{font-size:8pt;color:#7a7a6e;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}'+
  '.batch-item .val{font-size:11pt;font-weight:700;color:#1a1a18;margin-top:1px;}'+
  // 区块
  '.section{margin-bottom:12px;break-inside:avoid;}'+
  '.section-head{background:#5B9B2C;color:white;padding:6px 12px;border-radius:5px 5px 0 0;font-size:9pt;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:6px;}'+
  '.section-head .badge{background:rgba(255,255,255,0.2);border-radius:20px;padding:1px 8px;font-size:8pt;}'+
  '.section-body{border:1px solid #ddd;border-top:none;border-radius:0 0 5px 5px;padding:10px 12px;}'+
  // 字段行
  '.field-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 16px;}'+
  '.field-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 16px;}'+
  '.field{padding:4px 0;border-bottom:1px solid #f0f0ec;}'+
  '.field:last-child{border-bottom:none;}'+
  '.field .k{font-size:8pt;color:#7a7a6e;font-weight:600;}'+
  '.field .v{font-size:10pt;color:#1a1a18;font-weight:500;margin-top:1px;}'+
  '.field .v.empty{color:#ccc;}'+
  // 数据高亮
  '.stat-row{display:flex;gap:10px;margin-bottom:8px;}'+
  '.stat-box{flex:1;background:#f6f6f0;border-radius:5px;padding:8px 10px;text-align:center;}'+
  '.stat-box.highlight{background:#dff0c8;}'+
  '.stat-box.warn{background:#f5ead6;}'+
  '.stat-box .sn{font-size:16pt;font-weight:800;color:#1a1a18;}'+
  '.stat-box.highlight .sn{color:#4a8022;}'+
  '.stat-box.warn .sn{color:#7A5C1E;}'+
  '.stat-box .sl{font-size:8pt;color:#7a7a6e;margin-top:2px;}'+
  // 缺陷表格
  '.defect-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}'+
  '.defect-item{background:#fafaf8;border:1px solid #eee;border-radius:4px;padding:5px 8px;display:flex;justify-content:space-between;align-items:center;}'+
  '.defect-item .dn{font-size:9pt;color:#555;}'+
  '.defect-item .dv{font-size:11pt;font-weight:700;color:#1a1a18;}'+
  '.defect-item .dv.red{color:#9B2226;}'+
  // 问题率
  '.rate-bar{background:#dff0c8;border:1px solid #c8d048;border-radius:5px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;margin-top:8px;}'+
  '.rate-bar .rl{font-size:9pt;color:#4a8022;font-weight:600;}'+
  '.rate-bar .rv{font-size:16pt;font-weight:800;color:#2d4a12;}'+
  // 签名
  '.sign-row{display:flex;gap:20px;margin-top:16px;padding-top:12px;border-top:1px solid #eee;}'+
  '.sign-item{flex:1;text-align:center;}'+
  '.sign-line{border-bottom:1px solid #999;height:32px;margin-bottom:4px;}'+
  '.sign-label{font-size:8pt;color:#7a7a6e;}'+
  // 页脚
  '.footer{text-align:center;font-size:8pt;color:#aaa;margin-top:16px;padding-top:8px;border-top:1px solid #eee;}'+
  '@media print{.no-print{display:none;}body{padding:0;}button{display:none;}}'+
  '</style></head><body>';

  // ── 操作按钮（打印时隐藏）──
  html+='<div class="no-print" style="position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:100;">'+
  '<button onclick="window.print()" style="padding:10px 20px;background:#5B9B2C;color:white;border:none;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;">📄 存储为PDF / 打印</button>'+
  '<button onclick="window.close()" style="padding:10px 16px;background:#eee;color:#555;border:none;border-radius:20px;font-size:13px;cursor:pointer;">关闭</button>'+
  '</div>';

  // ── 页头 ──
  html+='<div class="header">'+
  '<div class="header-left"><div class="logo">QA</div><div class="company">誉泽农供应链管理有限公司</div></div>'+
  '<div class="header-right"><div class="report-type">'+reportType+'</div><div class="report-date">'+dateStr+'</div></div>'+
  '</div>';

  // ── 批次摘要 ──
  html+='<div class="batch-bar">'+
  batchItem('柜号',b.id)+
  batchItem('品牌·品种',b.brand+' '+b.variety)+
  batchItem('产地·产区',(b.origin||'—')+' '+(b.region||''))+
  batchItem('到货日期',b.date||'—')+
  batchItem('规格',b.specs||'—')+
  batchItem('质检员',b.inspector||S.user)+
  '</div>';

  // ── T0 到货信息 ──
  html+=section('T0 · 到货记录',
    '<div class="field-grid">'+
    field('原柜号',b.originalNo)+
    field('车牌挂号',b.plate)+
    field('运输方式',b.transport+' '+b.days+'天')+
    field('预计箱数',b.boxes+'箱')+
    field('实收箱数',s3['t2-actual-boxes']||'—')+
    field('铅封状态',s1['t0-seal-note']||'—')+
    '</div>');

  // ── T1 开柜 ──
  html+=section('T1 · 开柜抽样',
    '<div class="field-grid">'+
    
    field('果肉温度_柜头',(s2['t1-ft-head']||'—')+'℃')+
    field('果肉温度_柜中',(s2['t1-ft-mid']||'—')+'℃')+
    field('果肉温度_柜尾',(s2['t1-ft-tail']||'—')+'℃')+
    field('开柜问题',s2['t1-issue-note']||'无异常')+
    field('气味',s2['t1-smell-note']||'—')+
    '</div>'+
    (s2['t1-temp-note']?'<div class="field" style="margin-top:6px;grid-column:1/-1;">'+
    '<div class="k">温度补充说明</div><div class="v">'+s2['t1-temp-note']+'</div></div>':'')+
    (s2['t1-pos-note']?'<div class="field" style="margin-top:6px;">'+
    '<div class="k">抽检位置覆盖</div><div class="v">'+s2['t1-pos-note']+'</div></div>':''));

  // ── T2 逐箱汇总 ──
  var lanci=parseInt(ctr['f-lanci'])||0,bug=parseInt(ctr['f-bug'])||0,mech=parseInt(ctr['f-mech'])||0;
  var skin=parseInt(ctr['f-skin'])||0,crack=parseInt(ctr['f-crack'])||0,oth1=parseInt(ctr['f-oth1'])||0;
  var totalApp=lanci+bug+mech+skin+crack+oth1;
  var dead=parseInt(ctr['f-dead'])||0,raw=parseInt(ctr['f-raw'])||0,white=parseInt(ctr['f-white'])||0;
  var burn=parseInt(ctr['f-burn'])||0,miss=parseInt(ctr['f-miss'])||0,oth2=parseInt(ctr['f-oth2'])||0;
  var totalFlesh=dead+raw+white+burn+miss+oth2;
  var tc=parseInt(s3['tc'])||0;
  var appRate=tc>0?(totalApp/tc*100).toFixed(1)+'%':'—';
  var fleshRate=tc>0?(totalFlesh/tc*100).toFixed(1)+'%':'—';
  var boxCnt=s3['_bc']||S.boxCount||0;

  html+=section('T2 · 逐箱检验汇总',
    '<div class="stat-row">'+
    '<div class="stat-box gray"><div class="sn">'+boxCnt+'</div><div class="sl">检验箱数</div></div>'+
    '<div class="stat-box gray"><div class="sn">'+tc+'</div><div class="sl">抽样总颗数</div></div>'+
    '<div class="stat-box gray"><div class="sn">'+(s3['t2-actual-boxes']||'—')+'</div><div class="sl">实收箱数</div></div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:10px;">'+
    '<div style="flex:1;background:#fdf5ea;border:1.5px solid #d9c090;border-radius:6px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center;">'+
    '<div><div style="font-size:9pt;font-weight:700;color:#7A5C1E;">外观问题率</div><div style="font-size:8pt;color:#9a7030;margin-top:2px;">'+totalApp+'颗 / '+tc+'颗抽样</div></div>'+
    '<div style="font-size:20pt;font-weight:900;color:#5c4315;">'+appRate+'</div></div>'+
    '<div style="flex:1;background:#dff0c8;border:1.5px solid #b7d992;border-radius:6px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center;">'+
    '<div><div style="font-size:9pt;font-weight:700;color:#2D6A4F;">果肉问题率</div><div style="font-size:8pt;color:#5B9B2C;margin-top:2px;">'+totalFlesh+'颗 / '+tc+'颗抽样</div></div>'+
    '<div style="font-size:20pt;font-weight:900;color:#1B4332;">'+fleshRate+'</div></div>'+
    '</div>'+
    '<div style="font-size:8pt;font-weight:700;color:#7a7a6e;text-transform:uppercase;letter-spacing:.07em;padding-bottom:5px;border-bottom:0.5px solid #e8e8e0;margin-bottom:7px;">外观瑕疵明细</div>'+
    '<div class="defect-grid">'+
    defectItem('烂刺',lanci,'b')+defectItem('裂口',crack,'b')+defectItem('病虫害',bug,'b')+
    defectItem('机械伤',mech,'b')+defectItem('表皮瑕疵',skin,'b')+defectItem('其他外观',oth1,'b')+
    '</div>'+
    '<div style="font-size:8pt;font-weight:700;color:#7a7a6e;text-transform:uppercase;letter-spacing:.07em;padding-bottom:5px;border-bottom:0.5px solid #e8e8e0;margin:10px 0 7px;">果肉瑕疵明细</div>'+
    '<div class="defect-grid">'+
    defectItem('死包',dead,'r')+defectItem('夹生',raw,'r')+defectItem('白肉',white,'r')+
    defectItem('烧核',burn,'r')+defectItem('缺房',miss,'r')+defectItem('其他果肉',oth2,'r')+
    '</div>'+
    (s3['t2-weight-note']?'<div class="note-row" style="margin-top:8px;"><div class="nk">大小果备注</div><div class="nv">'+s3['t2-weight-note']+'</div></div>':'')+
    (s3['t2-box-note']?'<div class="note-row"><div class="nk">箱数差异说明</div><div class="nv">'+s3['t2-box-note']+'</div></div>':''));

  // ── T3 销售验证 ──
  html+=section('T3 · 销售过程验证',
    '<div class="field-grid">'+
    field('取样日期',s4['t3-date']||'—')+
    field('取样位置',(s4['t3-pos']||'—')+' '+(s4['t3-pos-note']||''))+
    field('糖度',(s4['t3-sugar']||'—')+'%')+
    field('口感',s4['t3-pos']||'—')+
    field('抽检数量',(s4['t3-check-count']||'—')+'颗')+
    field('发现问题',s4['t3-check-note']||'无新增问题')+
    '</div>');

  // ── T4 T5 仅完整报告有 ──
  if(isFinal){
    html+=section('T4 · 库存质量跟踪',
      '<div class="field-grid">'+
      field('检查日期',s5['t4-date']||'—')+
      field('库存位置',s5['t4-location']||'—')+
      field('成熟度变化','—')+
      '</div>'+
      (s5['t4-defect-note']?'<div class="field" style="margin-top:6px;"><div class="k">新发现瑕疵</div><div class="v">'+s5['t4-defect-note']+'</div></div>':'')+
      (s5['t4-suggestion']?'<div class="field"><div class="k">处理建议</div><div class="v">'+s5['t4-suggestion']+'</div></div>':''));

    html+=section('T5 · 客诉与损耗',
      '<div class="field-grid">'+
      field('客诉数量',(s6['t5-complaint-qty']||'0')+'颗')+
      field('损耗数量',(s6['t5-loss-qty']||'0')+'颗')+
      field('处理结果','—')+
      '</div>'+
      (s6['t5-complaint-desc']?'<div class="field" style="margin-top:6px;"><div class="k">客诉问题描述</div><div class="v">'+s6['t5-complaint-desc']+'</div></div>':'')+
      (s6['t5-loss-note']?'<div class="field"><div class="k">损耗说明</div><div class="v">'+s6['t5-loss-note']+'</div></div>':''));
  }

  // ── 签名 ──
  html+='<div class="sign-row">'+
  '<div class="sign-item"><div class="sign-line"></div><div class="sign-label">质检员签名</div></div>'+
  '<div class="sign-item"><div class="sign-line"></div><div class="sign-label">主管审核</div></div>'+
  '<div class="sign-item"><div class="sign-line"></div><div class="sign-label">日期</div></div>'+
  '</div>';

  // ── 页脚 ──
  html+='<div class="footer">誉泽农供应链管理有限公司 · 榴莲QA质检系统 · '+reportType+' · 生成于'+dateStr+'</div>';

  html+='</body></html>';

  var w=window.open('','_blank');
  w.document.write(html);
  w.document.close();
}

// ── 辅助函数 ─────────────────────────────────────────
function batchItem(k,v){return '<div class="batch-item"><div class="lbl">'+k+'</div><div class="val">'+(v||'—')+'</div></div>';}
function section(title,content){return '<div class="section"><div class="section-head">'+title+'</div><div class="section-body">'+content+'</div></div>';}
function field(k,v){return '<div class="field"><div class="k">'+k+'</div><div class="v '+(v?'':'empty')+'">'+(v||'—')+'</div></div>';}
function defectItem(n,v,c){var cls=v>0?(c==='b'?'brown':'red'):'';return '<div class="defect-item '+(v>0?'has-'+c:'')+'" style="background:'+(v>0&&c==='b'?'#fdf5ea':v>0?'#fff4f4':'#fafaf8')+';border:1px solid '+(v>0&&c==='b'?'#e0c080':v>0?'#f0b0b0':'#eee')+';"><div class="dn">'+n+'</div><div class="dv" style="color:'+(v>0&&c==='b'?'#7A5C1E':v>0?'#9B2226':'#ccc')+';">'+v+'</div></div>';}
</script>
